services:
  - type: web
    name: ssh-monitor-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.11.0
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: VALID_API_KEYS
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: ALERT_MIN_RISK
        value: HIGH
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_TO
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
