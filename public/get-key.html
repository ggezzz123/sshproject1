<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>รับ API Key - SSH Monitor</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script src="/theme.js"></script>
  <script>
    // Logged-in users only: bounce to the dashboard login before anything renders.
    (function () {
      var t = null;
      try { t = localStorage.getItem("ssh_monitor_token"); } catch (e) {}
      var ok = false;
      if (t) {
        try {
          var p = JSON.parse(atob(t.split(".")[1]));
          ok = !p.exp || p.exp * 1000 > Date.now();
        } catch (e) {}
      }
      if (!ok) {
        try { localStorage.removeItem("ssh_monitor_token"); } catch (e) {}
        location.replace("/app?next=/get-key");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .key-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-family: var(--font-mono);
      font-size: 13px;
      word-break: break-all;
      margin: 8px 0 12px;
      color: var(--success);
    }
    .hint { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
    .server-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
    }
    .server-row .meta { min-width: 0; }
    .server-row .name { font-weight: 600; }
    .server-row .key { font-size: 11px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .server-row .actions { display: flex; gap: 4px; flex-shrink: 0; }
    .gk-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <button type="button" class="theme-toggle floating" id="themeToggle" aria-label="สลับโหมดสว่าง / มืด"></button>
    <div class="login-card" style="width: 460px;">
      <div class="hint" style="margin: 0 0 12px;"><a href="/app">&larr; กลับไปแดชบอร์ด</a> &nbsp;·&nbsp; <a href="/">หน้าแรก</a></div>
      <h1>รับ API Key</h1>
      <div class="sub">สร้างและจัดการ API key ของเซิร์ฟเวอร์ SSH ของคุณ</div>

      <div id="error" class="error-banner" style="display:none;"></div>

      <div id="keyView">
        <div class="field">
          <label>ชื่อเซิร์ฟเวอร์</label>
          <input class="input" id="serverName" placeholder="เช่น web01" autocomplete="off" />
        </div>
        <button class="btn primary" id="generateBtn" style="width:100%;">สร้าง Key</button>

        <div id="newKeyBox" style="display:none; margin-top:16px;">
          <label>API key ใหม่ — คัดลอกเก็บไว้ตอนนี้</label>
          <div class="key-box" id="newKeyValue"></div>
          <button class="btn secondary" id="copyNewKey" style="width:100%;">คัดลอก Key</button>
          <label style="margin-top:12px;">คำสั่งติดตั้ง agent (รันบนเซิร์ฟเวอร์ Linux)</label>
          <div class="key-box" id="installCmd" style="color: var(--text-muted); font-size:11px;"></div>
        </div>

        <div id="myServers" style="margin-top:24px;"></div>

        <div class="hint" style="text-align:center;margin-top:16px;">
          <a href="#" id="logoutLink">ออกจากระบบ</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/buttons.js"></script>
  <script>
    const backendOrigin = location.origin;

    const themeBtn = document.getElementById("themeToggle");
    function renderThemeBtn() {
      themeBtn.textContent = window.currentTheme() === "dark" ? "☀ โหมดสว่าง" : "☾ โหมดมืด";
    }
    themeBtn.addEventListener("click", () => { window.toggleTheme(); renderThemeBtn(); });
    renderThemeBtn();
    const TOKEN_KEY = "ssh_monitor_token";
    function getToken() { return localStorage.getItem(TOKEN_KEY); }
    function setToken(t) {
      if (t) localStorage.setItem(TOKEN_KEY, t);
      else localStorage.removeItem(TOKEN_KEY);
    }

    const errorEl = document.getElementById("error");
    function showError(msg) { errorEl.textContent = msg; errorEl.style.display = "block"; }
    function hideError() { errorEl.style.display = "none"; }

    async function api(path, opts = {}) {
      const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
      const token = getToken();
      if (token) headers["Authorization"] = "Bearer " + token;
      const res = await fetch(path, { ...opts, headers });
      if (res.status === 401) {
        setToken(null);
        location.replace("/app?next=/get-key");
        throw new Error("เซสชันหมดอายุ กรุณาล็อกอินใหม่");
      }
      if (!res.ok) {
        let msg = res.statusText;
        try { msg = (await res.json()).error || msg; } catch (e) {}
        throw new Error(msg);
      }
      return res.json();
    }

    document.getElementById("generateBtn").addEventListener("click", async () => {
      hideError();
      const name = document.getElementById("serverName").value.trim();
      if (!name) { showError("กรุณาตั้งชื่อเซิร์ฟเวอร์"); return; }
      const btn = document.getElementById("generateBtn");
      btn.disabled = true;
      btn.textContent = "กำลังสร้าง...";
      try {
        const server = await api("/api/servers", { method: "POST", body: JSON.stringify({ name }) });
        document.getElementById("newKeyValue").textContent = server.api_key;
        document.getElementById("installCmd").textContent =
          `curl -sSL ${backendOrigin}/install.sh | sudo MONITOR_API_KEY=${server.api_key} bash -s -- ${backendOrigin}/api/logs`;
        document.getElementById("newKeyBox").style.display = "block";
        document.getElementById("serverName").value = "";
        loadMyServers();
      } catch (e) {
        showError(e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "สร้าง Key";
      }
    });

    document.getElementById("copyNewKey").addEventListener("click", () => {
      navigator.clipboard.writeText(document.getElementById("newKeyValue").textContent).then(() => {
        const b = document.getElementById("copyNewKey");
        b.textContent = "คัดลอกแล้ว!";
        setTimeout(() => (b.textContent = "คัดลอก Key"), 1500);
      });
    });

    document.getElementById("logoutLink").addEventListener("click", (e) => {
      e.preventDefault();
      setToken(null);
      location.href = "/app";
    });

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadMyServers() {
      const container = document.getElementById("myServers");
      container.innerHTML = '<div class="hint">กำลังโหลดเซิร์ฟเวอร์ของคุณ…</div>';
      try {
        const servers = await api("/api/my-servers");
        if (!servers.length) {
          container.innerHTML = '<div class="hint">ยังไม่มีเซิร์ฟเวอร์ — สร้าง key แรกได้ด้านบน</div>';
          return;
        }
        container.innerHTML = "<label>เซิร์ฟเวอร์ของคุณ</label>";
        servers.forEach((s) => {
          const row = document.createElement("div");
          row.className = "card server-row";

          const meta = document.createElement("div");
          meta.className = "meta";
          meta.innerHTML = `<div class="name">${escapeHtml(s.name)}</div><div class="key mono">${escapeHtml(s.api_key)}</div>`;

          const actions = document.createElement("div");
          actions.className = "actions";

          const copyBtn = document.createElement("button");
          copyBtn.className = "btn ghost sm";
          copyBtn.textContent = "คัดลอก";
          copyBtn.addEventListener("click", () => {
            navigator.clipboard.writeText(s.api_key).then(() => {
              copyBtn.textContent = "คัดลอกแล้ว!";
              setTimeout(() => (copyBtn.textContent = "คัดลอก"), 1500);
            });
          });

          const regenBtn = document.createElement("button");
          regenBtn.className = "btn ghost sm";
          regenBtn.textContent = "สร้างใหม่";
          regenBtn.addEventListener("click", async () => {
            if (!confirm(`สร้าง key ใหม่ให้ "${s.name}"? key เดิมจะใช้ไม่ได้ทันที`)) return;
            try {
              await api(`/api/servers/${s.id}/regenerate-key`, { method: "POST" });
              loadMyServers();
            } catch (e) {
              showError(e.message);
            }
          });

          const delBtn = document.createElement("button");
          delBtn.className = "btn ghost sm danger";
          delBtn.textContent = "ลบ";
          delBtn.addEventListener("click", async () => {
            if (!confirm(`ลบ key และเซิร์ฟเวอร์ "${s.name}"?\n\nagent ที่ใช้ key นี้จะส่ง log ไม่ได้อีก และ log กับเหตุการณ์ของเครื่องนี้จะถูกลบถาวร`)) return;
            try {
              await api(`/api/servers/${s.id}`, { method: "DELETE" });
              document.getElementById("newKeyBox").style.display = "none";
              loadMyServers();
            } catch (e) {
              showError(e.message);
            }
          });

          actions.appendChild(copyBtn);
          actions.appendChild(regenBtn);
          actions.appendChild(delBtn);
          row.appendChild(meta);
          row.appendChild(actions);
          container.appendChild(row);
        });
      } catch (e) {
        container.innerHTML = "";
        showError(e.message);
      }
    }

    // Reuses the token the dashboard stores; the <head> guard already sent anonymous visitors to login.
    if (getToken()) loadMyServers();
  </script>
</body>
</html>
