# Rename `app` below to something unique (Fly app names are global) before first deploy.
app = "ssh-monitor"
primary_region = "sin"  # Singapore - closest Fly region to Thailand

[build]

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  DB_PATH = "/data/ssh-monitor.db"
  TRUST_PROXY = "1"
  ADMIN_USERNAME = "admin"
  ALERT_MIN_RISK = "HIGH"
  LOG_TZ_OFFSET = "+07:00"
  ALERT_TZ = "Asia/Bangkok"

# Persistent volume for the SQLite file - survives deploys and restarts.
# Create it once before the first deploy: fly volumes create data --region sin --size 1
[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # keep running - this is the whole point vs. Render free tier
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
