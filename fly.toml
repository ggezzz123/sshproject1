# fly.toml app configuration file for ssh-monitor
# https://fly.io/docs/reference/configuration/

app = 'ssh-monitor'
primary_region = 'ams'   # matches the region `fly launch` already created this app in

[build]

[env]
  PORT = '8080'
  HOST = '0.0.0.0'
  DB_PATH = '/data/ssh-monitor.db'
  TRUST_PROXY = '1'
  ADMIN_USERNAME = 'admin'
  ALERT_MIN_RISK = 'HIGH'
  LOG_TZ_OFFSET = '+07:00'
  ALERT_TZ = 'Asia/Bangkok'

# Persistent volume for the SQLite file - survives deploys and restarts.
# Create it once, in the SAME region as primary_region above:
#   fly volumes create data --region ams --size 1
[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'   # keep running - this is the whole point vs. Render free tier
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
